[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 平台约束靠 wheel 的平台标签（win_amd64），由 tools/build_wheel.ps1 修正。
# METADATA 里的 Requires-Dist 只能约束依赖，约束不了包自身；classifiers 写
# "仅 Windows" 只是提示，pip 不会据此拒绝安装。真正让非 Windows 装不上的是标签。
[project]
name = "pywinui3"
version = "0.2.3"
description = "Tkinter-style Python UI library backed by a real WinUI 3 renderer"
readme = { text = "用 tkinter 的写法，渲染真正的 WinUI 3 界面。详见仓库根目录 README.md。", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
keywords = ["winui", "winui3", "windows", "gui", "tkinter", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/SystenGames/PyWinUI3"
Source = "https://github.com/SystenGames/PyWinUI3"
Issues = "https://github.com/SystenGames/PyWinUI3/issues"

[tool.setuptools]
# 让 MANIFEST.in 生效：host 产物不是 .py，必须显式声明才会进 wheel
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pywinui3*"]

[tool.setuptools.package-data]
# 宿主构建产物随包分发，安装后无需额外构建。
# 这里只声明顶层文件；runtime/ 下的多级子目录（各语言资源、runtimes/）
# 由 MANIFEST.in 的 recursive-include 负责收进来。
pywinui3 = ["runtime/*"]
